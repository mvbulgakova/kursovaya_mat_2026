name: Проверка и сборка PDF

on:
  push:
  pull_request:

jobs:
  test:
    name: Тесты приложения
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node test/verify.mjs
      - run: node test/e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: model/test/shots

  pdf:
    name: Сборка курсовой (pdfLaTeX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          working_directory: tex
          root_file: main.tex
          latexmk_use_pdflatex: true
      - uses: actions/upload-artifact@v4
        with:
          name: kursovaya-pdf
          path: tex/main.pdf
